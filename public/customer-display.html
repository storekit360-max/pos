<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Display</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc;font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{width:min(100%,1400px);margin:auto;padding:clamp(12px,3vw,48px);min-height:100vh;display:flex;flex-direction:column}.head{display:flex;align-items:center;gap:18px;padding-bottom:clamp(12px,2vw,28px);border-bottom:1px solid #263247;min-width:0}.logo{width:clamp(44px,6vw,76px);height:clamp(44px,6vw,76px);flex:0 0 auto;object-fit:contain;border-radius:16px;background:#fff}.name{font-size:clamp(22px,4vw,48px);font-weight:800;line-height:1.05;overflow-wrap:anywhere}.desc,.muted{color:#aab6ca;margin-top:8px}.body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:clamp(12px,3vw,36px);flex:1;padding:clamp(14px,3vw,34px) 0;min-width:0}.items{display:flex;flex-direction:column;gap:14px;min-width:0}.item{display:flex;justify-content:space-between;gap:20px;padding:18px 20px;background:#121c2d;border:1px solid #263247;border-radius:16px;min-width:0;overflow-wrap:anywhere}.item small{display:block;color:#aab6ca;margin-top:5px}.summary{align-self:start;min-width:0;padding:clamp(14px,2vw,24px);background:#121c2d;border:1px solid #263247;border-radius:20px;overflow-wrap:anywhere}.line{display:flex;justify-content:space-between;gap:16px;padding:12px 0;color:#d5deeb}.total{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:18px;padding-top:20px;border-top:1px solid #334155;font-size:clamp(18px,3vw,44px);font-weight:800;color:var(--accent,#fb923c);white-space:nowrap}.total #total{min-width:0;text-align:right;font-size:clamp(14px,2.6vw,38px);font-variant-numeric:tabular-nums;white-space:nowrap}.welcome{margin:auto;text-align:center;color:#aab6ca;font-size:clamp(20px,3vw,32px)}.prompt{text-align:center;margin:auto;padding:clamp(8px,2vw,20px);min-width:0}.prompt strong{display:block;font-size:clamp(22px,4vw,42px);margin-bottom:12px}.phone-entry{width:min(100%,520px);margin:20px auto 0}.phone-entry label{display:block;color:#aab6ca;font-size:clamp(16px,2vw,24px);margin-bottom:12px}.phone-entry input{width:100%;padding:clamp(10px,2vw,18px);border:2px solid #334155;border-radius:14px;background:#0b1220;color:#fff;text-align:center;font:700 clamp(22px,4vw,38px) system-ui;letter-spacing:.08em}.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,1vw,10px);margin-top:14px}.keypad button,.submit-phone{border:1px solid #334155;border-radius:12px;background:#1a2638;color:#fff;min-height:clamp(42px,8vh,76px);font:700 clamp(18px,3vw,30px) system-ui;cursor:pointer;touch-action:manipulation}.keypad button:active,.submit-phone:active{background:var(--accent,#fb923c)}.submit-phone{width:100%;margin-top:12px;background:var(--accent,#fb923c);border:0;font-size:clamp(17px,2.5vw,24px)}.phone-help{color:#aab6ca;font-size:15px;margin-top:10px}.foot{color:#7d8aa0;text-align:center;padding-top:20px}@media(max-width:700px){.body{grid-template-columns:minmax(0,1fr)}.summary{order:-1}.head{align-items:flex-start}}@media(max-height:650px){.wrap{padding-top:10px;padding-bottom:10px}.head{padding-bottom:10px}.body{padding:10px 0}.phone-entry{margin-top:10px}.keypad{margin-top:8px}.keypad button,.submit-phone{min-height:40px}.foot{padding-top:6px}}
</style>
 </head><body><main class="wrap"><header class="head"><img class="logo" id="logo" alt="Business logo" style="display:none"><div><div class="name" id="business">Welcome</div><div class="desc" id="description"></div></div></header><section class="body"><div class="items" id="items"><div class="welcome">Your items will appear here as they are scanned.</div></div><aside class="summary"><div class="line"><span>Subtotal</span><b id="subtotal">—</b></div><div class="line"><span>Discount</span><b id="discount">—</b></div><div id="charges"></div><div class="total"><span>Total</span><span id="total">—</span></div><div class="muted" id="customer"></div></aside></section><footer class="foot" id="footer"></footer></main>
<script>
const $=s=>document.querySelector(s),fmt=(currency,n)=>`${currency||''} ${Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
let phoneValue='';
let renderedMode='';
function updatePhone(value){phoneValue=String(value||'').replace(/\D/g,'').slice(0,20);const input=$('#phone-input');if(input)input.value=phoneValue}
function pressKey(key){if(key==='Clear')phoneValue='';else if(key==='⌫')phoneValue=phoneValue.slice(0,-1);else if(phoneValue.length<20)phoneValue+=key;updatePhone(phoneValue);window.customerDisplay?.enterPhone(phoneValue)}
window.customerDisplay?.onData(d=>{if(!d)return;document.documentElement.style.setProperty('--accent',d.accent||'#fb923c');$('#business').textContent=d.business||'Welcome';$('#description').textContent=d.description||d.tagline||'';$('#footer').textContent=d.footer||'';const logo=$('#logo');if(logo.dataset.src!==(d.logo||'')){logo.dataset.src=d.logo||'';if(d.logo){logo.src=d.logo;logo.style.display=''}else{logo.removeAttribute('src');logo.style.display='none'}}const items=$('#items');if(d.mode!=='bill'&&d.mode!=='ready'&&renderedMode==='idle'){updatePhone(d.phone);return}if(d.mode==='ready'){if(renderedMode!=='ready')items.innerHTML=`<div class="prompt"><strong>Thank you, ${esc(d.customer||'')}!</strong><div class="phone-help">Your number has been confirmed. The cashier will start your bill.</div></div>`;renderedMode='ready';$('#customer').textContent='';$('#subtotal').textContent='—';$('#discount').textContent='—';$('#charges').innerHTML='';$('#total').textContent='—';return}if(d.mode!=='bill'){renderedMode='idle';updatePhone(d.phone);items.innerHTML=`<div class="prompt"><strong>Enter your mobile number</strong><div class="phone-entry"><label for="phone-input">Use the keypad to enter your phone number</label><input id="phone-input" type="tel" inputmode="none" autocomplete="off" readonly aria-label="Customer phone number"><div class="keypad" aria-label="Phone number keypad">${['1','2','3','4','5','6','7','8','9','Clear','0','⌫'].map(k=>`<button type="button" data-key="${k}" aria-label="${k==='⌫'?'Backspace':k}">${k}</button>`).join('')}</div><button class="submit-phone" type="button" id="submit-phone">Continue</button><div class="phone-help">Your number helps us find your customer account.</div></div></div>`;$('#customer').textContent='';$('#subtotal').textContent='—';$('#discount').textContent='—';$('#charges').innerHTML='';$('#total').textContent='—';return}renderedMode='bill';$('#customer').textContent=d.customer?`Customer: ${d.customer}${d.phone?' · '+d.phone:''}`:'';items.innerHTML=d.items?.length?d.items.map(i=>`<div class="item"><div>${esc(i.name)}<small>${Number(i.qty)||0} × ${esc(fmt(d.currency,i.price))}</small></div><b>${esc(fmt(d.currency,i.lineTotal))}</b></div>`).join(''):'<div class="welcome">Your items will appear here as they are scanned.</div>';$('#subtotal').textContent=fmt(d.currency,d.subtotal);$('#discount').textContent='−'+fmt(d.currency,d.discount);$('#charges').innerHTML=(d.charges||[]).map(c=>`<div class="line"><span>${esc(c.name)} (${Number(c.rate)||0}%)</span><b>${esc(fmt(d.currency,c.amount))}</b></div>`).join('');$('#total').textContent=fmt(d.currency,d.total)});
document.addEventListener('click',e=>{const key=e.target.closest('[data-key]');if(key)pressKey(key.dataset.key);if(e.target.closest('#submit-phone'))window.customerDisplay?.submitPhone()});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
